services:

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "--username=$POSTGRES_USER", "--port=$POSTGRES_PORT", "--dbname=$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    command:
      - -p ${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    networks:
      - app_network

  back:
    build:
      context: .
      dockerfile: Dockerfile_back
      args:
        - FASTAPI_PORT=${FASTAPI_PORT}
        - CONTAINER_HOME=${CONTAINER_HOME}
    container_name: fastapi_back
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      CONTAINER_HOME: ${CONTAINER_HOME}
    ports:
      - ${FASTAPI_PORT}:${FASTAPI_PORT}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FASTAPI_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ${HOST_HOME}/tasks:${CONTAINER_HOME}/tasks:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    #- /home/admin/tasks:/app/tasks:rw
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_network

